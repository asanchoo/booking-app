name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_test_password
          POSTGRES_DB: booking_regression
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_regression"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run db:migrate --prefix server
      - run: npm run db:seed --prefix server
      - name: Verify PostgreSQL schema and seed
        run: npm run db:setup --prefix server
        env:
          DATABASE_URL: postgresql://booking:booking_test_password@127.0.0.1:5432/booking_regression?sslmode=disable
      - name: Verify booking and role workflows on PostgreSQL
        run: node server/scripts/regression.mjs
        env:
          DATABASE_URL: postgresql://booking:booking_test_password@127.0.0.1:5432/booking_regression?sslmode=disable
      - run: npm test --prefix server
      - run: npm run build --prefix client
      - run: node --check server/index.js
      - run: node --check server/src/app.js
      - run: node --check api/index.js
