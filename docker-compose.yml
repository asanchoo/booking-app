services:
  booking-app:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - path: server/.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: 3001
      TZ: Asia/Almaty
      TRUST_PROXY: "true"
      TELEGRAM_MODE: webhook
      CLIENT_ORIGIN: http://localhost:3001,http://127.0.0.1:3001
    volumes:
      - booking-data:/app/data
      - booking-uploads:/app/server/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  booking-data:
  booking-uploads:
